<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" fill="#0A0A0A" rx="6"/>
  <!-- Gold hexagon for arena -->
  <g transform="translate(16, 16)">
    <!-- Outer hexagon -->
    <path d="M 0,-10 L 8.66,-5 L 8.66,5 L 0,10 L -8.66,5 L -8.66,-5 Z" fill="none" stroke="#FFD700" stroke-width="1.5"/>
    <!-- Inner hexagon -->
    <path d="M 0,-6 L 5.2,-3 L 5.2,3 L 0,6 L -5.2,3 L -5.2,-3 Z" fill="#FFD700" opacity="0.3"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="1.5" fill="#FFD700"/>
  </g>
</svg>
