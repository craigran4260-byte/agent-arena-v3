# Docker Compose for Agent Arena V3 Local Development
# Provides PostgreSQL and Redis for production-like environment

services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-arena-postgres
    environment:
      POSTGRES_USER: agentarena
      POSTGRES_PASSWORD: agentarena_dev_password
      POSTGRES_DB: agentarena
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentarena -d agentarena"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-arena-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

# Usage:
# 1. Start services: docker-compose up -d
# 2. Stop services: docker-compose down
# 3. Reset data: docker-compose down -v
#
# Connection strings:
# PostgreSQL: postgresql://agentarena:agentarena_dev_password@localhost:5432/agentarena
# Redis: redis://localhost:6379