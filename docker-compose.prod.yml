# Docker Compose for Agent Arena V3 Production
# Full production stack with app, PostgreSQL, Redis, and optional reverse proxy

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-arena-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://agentarena:${POSTGRES_PASSWORD}@postgres:5432/agentarena
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - agent-arena-network
    volumes:
      - app-data:/app/data

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agent-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentarena_prod_password}
      POSTGRES_DB: agentarena
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentarena -d agentarena"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-arena-network
    # Do not expose port in production (internal only)
    # ports:
    #   - "5432:5432"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: agent-arena-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-arena-network
    # Do not expose port in production (internal only)
    # ports:
    #   - "6379:6379"

  # Optional: Nginx Reverse Proxy (comment out if using external proxy)
  # nginx:
  #   image: nginx:alpine
  #   container_name: agent-arena-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./certs:/etc/nginx/certs:ro
  #   depends_on:
  #     app:
  #       condition: service_healthy
  #   networks:
  #     - agent-arena-network

volumes:
  postgres_data:
  redis_data:
  app-data:

networks:
  agent-arena-network:
    driver: bridge

# Usage:
# 1. Create .env file with production secrets
# 2. Build and start: docker-compose -f docker-compose.prod.yml up -d --build
# 3. View logs: docker-compose -f docker-compose.prod.yml logs -f app
# 4. Stop: docker-compose -f docker-compose.prod.yml down
# 5. Reset: docker-compose -f docker-compose.prod.yml down -v

# Required environment variables in .env:
# - NEXTAUTH_SECRET (generate with: openssl rand -hex 32)
# - ENCRYPTION_KEY (generate with: openssl rand -hex 32)
# - POSTGRES_PASSWORD (strong password)
# - NEXTAUTH_URL (your domain, e.g., https://agentarena.example.com)
# - ADMIN_EMAILS (comma-separated admin emails)