# Agent Arena V3 - Full Production Stack
# Includes: App, PostgreSQL, Redis, Nginx with HTTPS

services:
  # ===========================================
  # Main Application
  # ===========================================
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile.prod
    container_name: agent-arena-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://agentarena:${POSTGRES_PASSWORD}@postgres:5432/agentarena
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://${DOMAIN}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - CORS_ORIGINS=https://${DOMAIN},https://www.${DOMAIN}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - agent-arena-network
    volumes:
      - app-data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: agent-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agentarena
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentarena -d agentarena"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-arena-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ===========================================
  # Redis Cache
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: agent-arena-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-arena-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ===========================================
  # Nginx Reverse Proxy (HTTPS + WebSocket)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: agent-arena-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - agent-arena-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ===========================================
  # Certbot (SSL Certificate Automation)
  # ===========================================
  certbot:
    image: certbot/certbot
    container_name: agent-arena-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - agent-arena-network

volumes:
  postgres_data:
  redis_data:
  app-data:

networks:
  agent-arena-network:
    driver: bridge

# ===========================================
# Usage Instructions
# ===========================================
# 1. Create .env.prod file with secrets
# 2. First deploy: ./deploy.sh --init
# 3. Update: ./deploy.sh --update
# 4. Stop: docker compose -f deploy/docker-compose.full.yml down
# 5. View logs: docker compose -f deploy/docker-compose.full.yml logs -f app
# ===========================================